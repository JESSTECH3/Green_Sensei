{% extends 'base.html' %}

{% block content %}
<h2>Your Recommendations</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Recommendation</button>
</form>

<table border="1" cellpadding="5">
    <tr>
        <th>Message</th>
        <th>Seen</th>
        <th>Created At</th>
    </tr>
    {% for rec in recommendations %}
    <tr>
        <td>{{ rec.message }}</td>
        <td>{{ rec.is_seen }}</td>
        <td>{{ rec.created_at }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No recommendations yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
